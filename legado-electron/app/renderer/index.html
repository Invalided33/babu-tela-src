<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' http: https: data: blob:; media-src 'self' http: https: blob:; connect-src 'self' http: https: ws: wss:">
<title>Babu Tela</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="titlebar" hidden>
  <span class="brand"><img src="icon.png" alt="">Babu Tela</span>
  <span class="drag"></span>
  <button data-act="winMin" title="Minimizar" aria-label="Minimizar"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
  <button data-act="winMax" title="Maximizar" aria-label="Maximizar"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7"/></svg></button>
  <button data-act="winClose" class="close" title="Fechar" aria-label="Fechar"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
</div>
<div id="banner" hidden></div>
<div id="auth" hidden></div>
<div id="app" hidden>
  <nav id="rail"></nav>
  <aside id="sidebar">
    <header id="side-head"></header>
    <div id="side-list"></div>
    <div id="voice-panel"></div>
    <div id="user-panel"></div>
  </aside>
  <main id="main"></main>
  <aside id="members"></aside>
</div>
<div id="layer"></div>
<div id="toasts"></div>
<script src="voice.js"></script>
<script src="app.js"></script>
</body>
</html>
