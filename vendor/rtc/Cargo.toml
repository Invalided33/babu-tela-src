# rtc 0.21.1 as published on crates.io (the manifest cargo normalized for
# it, without its examples, integration tests and dev-dependencies, which
# only its own repository builds), with one fix and one addition the Babu
# Tela app needs and upstream does not have. The workspace's
# [patch.crates-io] puts it in place of the published crate, for the app and
# for webrtc alike.
#
# The fix, in src/peer_connection/handler/sctp.rs: an association's inbound
# data is held back until its handshake-complete event has gone on to the
# data channel handler. Without it, data the peer sent the moment its side
# came up could arrive in the same packet sweep as the COOKIE ACK (or ECHO)
# that brought this side up; the data channel handler then saw the data
# before the event that opens the negotiated channels, found the channel not
# open yet, and dropped the message (ErrDataChannelNotExisted), though SCTP
# had already acknowledged it. The same fix went upstream, with its tests, as
# https://github.com/webrtc-rs/rtc/pull/292 (against master, which also has
# #280's changes to this file).
#
# The addition, in src/peer_connection/configuration/setting_engine.rs
# (`with_dtls_extra_secret`), src/peer_connection/internal.rs and
# src/peer_connection/transport/dtls/mod.rs: a secret both ends hold, asked
# for as the DTLS handshake starts and handed to the DTLS under it
# (vendor/rtc-dtls, `with_extra_secret`), which mixes it into the keys. The
# app's is the post-quantum one its sealed signalling carries
# (crates/app/src/e2e/dtls.rs). Without one (the default) nothing changes.
# This folder and the patch can go only once a release of rtc carries both
# the fix and a way to mix in such a secret.

[package]
edition = "2024"
name = "rtc"
version = "0.21.1"
authors = ["Rain Liu <yliu@webrtc.rs>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Sans-I/O WebRTC implementation in Rust"
homepage = "https://webrtc.rs"
documentation = "https://docs.rs/rtc"
readme = "README.md"
keywords = [
    "sansio",
    "networking",
    "protocols",
]
categories = ["network-programming"]
license = "MIT/Apache-2.0"
repository = "https://github.com/webrtc-rs/rtc"
resolver = "2"

[features]
crypto-aws-lc-rs = [
    "crypto/crypto-aws-lc-rs",
    "dtls/crypto-aws-lc-rs",
    "rustls/aws-lc-rs",
    "rcgen/aws_lc_rs",
    "ice/crypto-aws-lc-rs",
    "stun/crypto-aws-lc-rs",
    "srtp/crypto-aws-lc-rs",
    "turn/crypto-aws-lc-rs",
]
crypto-ring = [
    "crypto/crypto-ring",
    "dtls/crypto-ring",
    "rustls/ring",
    "rcgen/ring",
    "ice/crypto-ring",
    "stun/crypto-ring",
    "srtp/crypto-ring",
    "turn/crypto-ring",
]
default = ["crypto-ring"]

[lib]
name = "rtc"
path = "src/lib.rs"

[dependencies.bytes]
version = "1.12.0"

[dependencies.crypto]
version = "0.21.1"
default-features = false
package = "rtc-crypto"

[dependencies.datachannel]
version = "0.21.1"
package = "rtc-datachannel"

[dependencies.dtls]
version = "0.21.1"
default-features = false
package = "rtc-dtls"

[dependencies.hex]
version = "0.4.3"

[dependencies.ice]
version = "0.21.1"
default-features = false
package = "rtc-ice"

[dependencies.interceptor]
version = "0.21.1"
package = "rtc-interceptor"

[dependencies.log]
version = "0.4.33"

[dependencies.mdns]
version = "0.21.1"
package = "rtc-mdns"

[dependencies.media]
version = "0.21.1"
package = "rtc-media"

[dependencies.pem]
version = "3.0.3"

[dependencies.rand]
version = "0.10.1"

[dependencies.rcgen]
version = "0.14.8"
features = ["pem"]
default-features = false

[dependencies.rtcp]
version = "0.21.1"
package = "rtc-rtcp"

[dependencies.rtp]
version = "0.21.1"
package = "rtc-rtp"

[dependencies.rustls]
version = "0.23.27"
features = ["std"]
default-features = false

[dependencies.sansio]
version = "1"

[dependencies.sctp]
version = "0.21.1"
package = "rtc-sctp"

[dependencies.sdp]
version = "0.21.1"
package = "rtc-sdp"

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.114"

[dependencies.shared]
version = "0.21.1"
features = [
    "marshal",
    "replay",
]
default-features = false
package = "rtc-shared"

[dependencies.srtp]
version = "0.21.1"
default-features = false
package = "rtc-srtp"

[dependencies.stun]
version = "0.21.1"
default-features = false
package = "rtc-stun"

[dependencies.turn]
version = "0.21.1"
default-features = false
package = "rtc-turn"

[dependencies.unicase]
version = "2.8"

[dependencies.url]
version = "2.5.0"

[dependencies.x509-parser]
version = "0.16.0"

