[package]
# The project's tooling, in Rust: `cargo xtask <comando>` (the alias lives
# in .cargo/config.toml). Publishes the server, builds the installer,
# publishes updates, runs the tests end to end and redraws the icons.
name = "xtask"
description = "Ferramentas do Babu Tela: servidor, instalador, atualização e testes"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
babutela-buildinfo.workspace = true
# Only for its payload format (packing the app into the installer).
babutela-setup = { path = "../setup" }
chrono.workspace = true
futures-util.workspace = true
# The noise suppression's weights, stored in float16 (`cargo xtask modelo`).
half.workspace = true
hex.workspace = true
hmac.workspace = true
# The stickers of the fake GIPHY that `cargo xtask medir figurinhas` runs.
image.workspace = true
reqwest.workspace = true
# Signs the updates (`cargo xtask chave`, `publicar`): Ed25519.
ring.workspace = true
# The version's entry in the public record, as the Worker writes it.
base64.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
# The CPU time and memory of the app copies `cargo xtask medir` runs.
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_System_WindowsProgramming"] }
